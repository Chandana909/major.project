# Lint and tests on every push and pull request. The Python tests run on SQLite and,
# through the service container, on PostgreSQL; no test calls a model; the Python
# dependencies are audited for known vulnerabilities (pip-audit). The frontend
# job lints, type-checks, tests and builds the web application. The e2e job runs the
# whole application in a browser: the API on a new store, serving the built web
# application, driven by Playwright (auditiq/frontend/e2e). The compose job starts
# PostgreSQL from deploy/postgres/docker-compose.yml, as a team with Docker would,
# and runs the tests and an audit against it. The container job builds the image of auditiq/Dockerfile,
# starts it with PostgreSQL (auditiq/deploy/docker-compose.yml) and audits a ledger in it.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditiq
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: auditiq
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: auditiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auditiq -d auditiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AUDITIQ_NO_DOTENV: "1"
      AUDITIQ_TEST_DATABASE_URL: postgresql://auditiq:ci-only@localhost:5432/auditiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: auditiq/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Known vulnerabilities in the Python dependencies
        # Pillow is held below 13 by Streamlit, and its fixes are in 13. AuditIQ decodes no uploaded image with it
        # (docs/SECURITY.md, Section 4), so these advisories are ignored by name; any other one fails the job.
        run: >-
          pip install --upgrade setuptools pip-audit &&
          pip-audit --skip-editable --progress-spinner off
          --ignore-vuln CVE-2026-112395 --ignore-vuln CVE-2026-112397 --ignore-vuln CVE-2026-112400
          --ignore-vuln CVE-2026-112404 --ignore-vuln CVE-2026-112895 --ignore-vuln CVE-2026-112896
          --ignore-vuln CVE-2026-112897 --ignore-vuln CVE-2026-112899
      - name: Create the copilot's read-only role
        run: PGPASSWORD=ci-only psql -h localhost -U auditiq -d auditiq_test -c "CREATE ROLE auditiq_reader NOLOGIN"
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditiq/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: auditiq/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Known vulnerabilities in the packages shipped to the browser
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditiq/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: auditiq/pyproject.toml
      - run: pip install -e .
        working-directory: auditiq
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: auditiq/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            auditiq/frontend/playwright-report
            auditiq/frontend/test-results

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: auditiq
    env:
      AUDITIQ_NO_DOTENV: "1"
      POSTGRES_PASSWORD: ci-only
      AUDITIQ_TEST_DATABASE_URL: postgresql://auditiq:ci-only@localhost:5544/auditiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: auditiq/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: PostgreSQL from the compose file, with its init.sql
        run: docker compose -f deploy/postgres/docker-compose.yml up -d --wait
      - name: The tests against the compose database (a stuck test is named in the annotations)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pip install pytest-timeout
          code=0
          timeout 1200 python -m pytest -o addopts="-p no:cacheprovider" -v --maxfail=3 --timeout=240 --timeout-method=thread > pytest.log 2>&1 || code=$?
          tail -n 2 pytest.log | while IFS= read -r line; do echo "::notice title=pytest::$line"; done
          grep -E "FAILED|ERROR|Timeout" pytest.log | head -n 4 | while IFS= read -r line; do echo "::notice title=failed::$line"; done
          grep -E 'auditiq/(auditiq|evaluation|tests)/' pytest.log | grep -E '^ +File' | tail -n 4 | while IFS= read -r line; do echo "::notice title=stack::$line"; done
          grep -E '^E  ' pytest.log | head -n 6 | while IFS= read -r line; do echo "::notice title=error::${line:0:900}"; done
          exit $code
      - name: A ledger set up and audited in the compose database
        run: |
          python -m auditiq --db postgresql://auditiq:ci-only@localhost:5544/auditiq setup --dataset data/bench_seed_101
          python -m auditiq --db postgresql://auditiq:ci-only@localhost:5544/auditiq run --config C1
      - if: always()
        run: docker compose -f deploy/postgres/docker-compose.yml down -v

  container:
    # The image of auditiq/Dockerfile with PostgreSQL, from auditiq/deploy/docker-compose.yml: built, started,
    # a ledger set up and audited inside it, and read back through the API with a token.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: auditiq
    env:
      POSTGRES_PASSWORD: ci-only
      AUDITIQ_API_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - name: The application and PostgreSQL from the compose file
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait
      - name: A ledger set up and audited in the container, then read through the API
        run: |
          docker compose -f deploy/docker-compose.yml exec -T app python -m auditiq setup --dataset data/bench_seed_101
          docker compose -f deploy/docker-compose.yml exec -T app python -m auditiq run --config C1
          curl -fsS http://127.0.0.1:8000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/overview)" = 401
          curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:8000/api/overview | python3 -c "import json, sys; d = json.load(sys.stdin); assert (d['audited'], d['findings'], d['backend']) == (5000, 300, 'postgres'), d; print('audited', d['audited'], 'findings', d['findings'], 'on', d['backend'])"
          curl -fsS http://127.0.0.1:8000/review | grep -q 'id="root"'
          curl -fsSI http://127.0.0.1:8000/review | grep -qi "content-security-policy: default-src 'self'"
      - if: failure()
        # The last lines of each container as annotations, which can be read without signing in.
        run: |
          docker compose -f deploy/docker-compose.yml ps -a
          for service in app postgres; do
            docker compose -f deploy/docker-compose.yml logs --no-color --tail 15 $service 2>&1 | tail -n 15 | while IFS= read -r line; do echo "::notice title=$service::${line:0:400}"; done
          done
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
