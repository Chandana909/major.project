# Lint and tests on every push and pull request. The Python tests run on SQLite and,
# through the service container, on PostgreSQL; no test calls a model. The frontend
# job lints, type-checks, tests and builds the web application.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditiq
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: auditiq
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: auditiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auditiq -d auditiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AUDITIQ_NO_DOTENV: "1"
      AUDITIQ_TEST_DATABASE_URL: postgresql://auditiq:ci-only@localhost:5432/auditiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: auditiq/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Create the copilot's read-only role
        run: PGPASSWORD=ci-only psql -h localhost -U auditiq -d auditiq_test -c "CREATE ROLE auditiq_reader NOLOGIN"
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditiq/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: auditiq/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Known vulnerabilities in the packages shipped to the browser
        run: npm audit --omit=dev --audit-level=high
