# Lint and tests on every push and pull request. The Python tests run on SQLite and,
# through the service container, on PostgreSQL; no test calls a model. The frontend
# job lints, type-checks, tests and builds the web application. The e2e job runs the
# whole application in a browser: the API on a new store, serving the built web
# application, driven by Playwright (auditiq/frontend/e2e). The compose job starts
# PostgreSQL from deploy/postgres/docker-compose.yml, as a team with Docker would,
# and runs the tests and an audit against it.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditiq
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: auditiq
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: auditiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auditiq -d auditiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AUDITIQ_NO_DOTENV: "1"
      AUDITIQ_TEST_DATABASE_URL: postgresql://auditiq:ci-only@localhost:5432/auditiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: auditiq/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Create the copilot's read-only role
        run: PGPASSWORD=ci-only psql -h localhost -U auditiq -d auditiq_test -c "CREATE ROLE auditiq_reader NOLOGIN"
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditiq/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: auditiq/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Known vulnerabilities in the packages shipped to the browser
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditiq/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: auditiq/pyproject.toml
      - run: pip install -e .
        working-directory: auditiq
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: auditiq/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            auditiq/frontend/playwright-report
            auditiq/frontend/test-results

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: auditiq
    env:
      AUDITIQ_NO_DOTENV: "1"
      POSTGRES_PASSWORD: ci-only
      AUDITIQ_TEST_DATABASE_URL: postgresql://auditiq:ci-only@localhost:5544/auditiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: auditiq/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: PostgreSQL from the compose file, with its init.sql
        run: docker compose -f deploy/postgres/docker-compose.yml up -d --wait
      - name: The tests against the compose database (a stuck test is named in the annotations)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pip install pytest-timeout
          code=0
          timeout 1200 python -m pytest -o addopts="-p no:cacheprovider" -v --maxfail=3 --timeout=240 --timeout-method=thread > pytest.log 2>&1 || code=$?
          tail -n 2 pytest.log | while IFS= read -r line; do echo "::notice title=pytest::$line"; done
          grep -E "FAILED|ERROR|Timeout" pytest.log | head -n 4 | while IFS= read -r line; do echo "::notice title=failed::$line"; done
          grep -E 'auditiq/(auditiq|evaluation|tests)/' pytest.log | grep -E '^ +File' | tail -n 4 | while IFS= read -r line; do echo "::notice title=stack::$line"; done
          grep -E '^E  ' pytest.log | head -n 6 | while IFS= read -r line; do echo "::notice title=error::${line:0:900}"; done
          exit $code
      - name: A ledger set up and audited in the compose database
        run: |
          python -m auditiq --db postgresql://auditiq:ci-only@localhost:5544/auditiq setup --dataset data/bench_seed_101
          python -m auditiq --db postgresql://auditiq:ci-only@localhost:5544/auditiq run --config C1
      - if: always()
        run: docker compose -f deploy/postgres/docker-compose.yml down -v
